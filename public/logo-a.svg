<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="#080d1a"/>
  <!-- Orbit ring tilted -->
  <ellipse cx="50" cy="50" rx="36" ry="14" fill="none" stroke="#3b82f6" stroke-width="1.4"
    transform="rotate(-28 50 50)" opacity="0.55"/>
  <!-- Central planet body -->
  <circle cx="50" cy="50" r="16" fill="#1e3a5f"/>
  <circle cx="50" cy="50" r="16" fill="none" stroke="#60a5fa" stroke-width="1.2" opacity="0.6"/>
  <!-- Initials -->
  <text x="50" y="55.5" text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="15" font-weight="400" fill="white" letter-spacing="0.5">OL</text>
  <!-- Satellite dot on orbit -->
  <circle cx="83" cy="43" r="3.5" fill="#60a5fa"/>
  <circle cx="83" cy="43" r="5.5" fill="none" stroke="#60a5fa" stroke-width="0.8" opacity="0.4"/>
</svg>
