<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="#080d1a"/>
  <!-- CubeSat body -->
  <rect x="32" y="34" width="36" height="36" rx="4" fill="#0f1f3d" stroke="#3b82f6" stroke-width="1.5"/>
  <!-- Solar panel left -->
  <rect x="10" y="42" width="18" height="20" rx="2" fill="#0f1f3d" stroke="#3b82f6" stroke-width="1"/>
  <!-- Solar panel cells left -->
  <line x1="16" y1="42" x2="16" y2="62" stroke="#1d4ed8" stroke-width="0.8"/>
  <line x1="22" y1="42" x2="22" y2="62" stroke="#1d4ed8" stroke-width="0.8"/>
  <line x1="10" y1="49" x2="28" y2="49" stroke="#1d4ed8" stroke-width="0.8"/>
  <line x1="10" y1="55" x2="28" y2="55" stroke="#1d4ed8" stroke-width="0.8"/>
  <!-- Solar panel right -->
  <rect x="72" y="42" width="18" height="20" rx="2" fill="#0f1f3d" stroke="#3b82f6" stroke-width="1"/>
  <!-- Solar panel cells right -->
  <line x1="78" y1="42" x2="78" y2="62" stroke="#1d4ed8" stroke-width="0.8"/>
  <line x1="84" y1="42" x2="84" y2="62" stroke="#1d4ed8" stroke-width="0.8"/>
  <line x1="72" y1="49" x2="90" y2="49" stroke="#1d4ed8" stroke-width="0.8"/>
  <line x1="72" y1="55" x2="90" y2="55" stroke="#1d4ed8" stroke-width="0.8"/>
  <!-- Panel connectors -->
  <line x1="28" y1="52" x2="32" y2="52" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="68" y1="52" x2="72" y2="52" stroke="#3b82f6" stroke-width="1.5"/>
  <!-- Body detail: antenna -->
  <line x1="50" y1="34" x2="50" y2="24" stroke="#60a5fa" stroke-width="1.2"/>
  <circle cx="50" cy="22" r="2" fill="#60a5fa"/>
  <!-- Body detail: initials -->
  <text x="50" y="56" text-anchor="middle"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="12" font-weight="300" fill="#60a5fa" letter-spacing="1">OL</text>
  <!-- Orbit arc behind -->
  <path d="M20 80 Q50 10 80 80" fill="none" stroke="#1e3a5f" stroke-width="1" opacity="0.6"/>
</svg>
