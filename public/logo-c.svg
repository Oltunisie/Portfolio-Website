<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="#080d1a"/>
  <!-- Outer thin ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#1e3a5f" stroke-width="1"/>
  <!-- Tick marks on ring -->
  <line x1="50" y1="12" x2="50" y2="17" stroke="#3b82f6" stroke-width="1.5" opacity="0.7"/>
  <line x1="88" y1="50" x2="83" y2="50" stroke="#3b82f6" stroke-width="1.5" opacity="0.7"/>
  <line x1="50" y1="88" x2="50" y2="83" stroke="#3b82f6" stroke-width="1.5" opacity="0.7"/>
  <line x1="12" y1="50" x2="17" y2="50" stroke="#3b82f6" stroke-width="1.5" opacity="0.7"/>
  <!-- Diagonal cross lines (engineering crosshair) -->
  <line x1="50" y1="18" x2="50" y2="82" stroke="#1e3a5f" stroke-width="0.8"/>
  <line x1="18" y1="50" x2="82" y2="50" stroke="#1e3a5f" stroke-width="0.8"/>
  <!-- Bold O -->
  <text x="50" y="58" text-anchor="middle"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="38" font-weight="200" fill="white" letter-spacing="-1">O</text>
  <!-- Small L subscript -->
  <text x="66" y="62" text-anchor="middle"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="14" font-weight="300" fill="#60a5fa">L</text>
  <!-- Orbit dot -->
  <circle cx="50" cy="12" r="3" fill="#60a5fa"/>
</svg>
