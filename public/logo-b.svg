<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="#080d1a"/>
  <!-- Launch trail arc -->
  <path d="M22 78 Q38 62 58 38" fill="none" stroke="#3b82f6" stroke-width="1.5"
    stroke-dasharray="3 3" opacity="0.5"/>
  <!-- Rocket body -->
  <g transform="translate(58,38) rotate(-45)">
    <!-- Body -->
    <rect x="-6" y="-14" width="12" height="20" rx="6" fill="white"/>
    <!-- Nose cone -->
    <polygon points="0,-22 -6,-14 6,-14" fill="white"/>
    <!-- Left fin -->
    <polygon points="-6,4 -13,12 -6,8" fill="#60a5fa"/>
    <!-- Right fin -->
    <polygon points="6,4 13,12 6,8" fill="#60a5fa"/>
    <!-- Window -->
    <circle cx="0" cy="-4" r="3.5" fill="#0a1628" stroke="#60a5fa" stroke-width="1"/>
    <!-- Flame -->
    <ellipse cx="0" cy="9" rx="3.5" ry="5" fill="#f97316" opacity="0.85"/>
  </g>
  <!-- Stars -->
  <circle cx="20" cy="22" r="1.2" fill="white" opacity="0.7"/>
  <circle cx="72" cy="18" r="0.9" fill="white" opacity="0.5"/>
  <circle cx="85" cy="55" r="1.1" fill="white" opacity="0.6"/>
  <circle cx="30" cy="50" r="0.8" fill="white" opacity="0.4"/>
  <circle cx="62" cy="72" r="1" fill="white" opacity="0.5"/>
  <circle cx="45" cy="15" r="0.9" fill="white" opacity="0.6"/>
</svg>
